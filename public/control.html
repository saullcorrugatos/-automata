<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Placar LIVE — Controle</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#030611;color:#fff;font:14px/1.4 Arial,sans-serif;display:flex;justify-content:center;padding:16px}
.controls{width:100%;max-width:420px;background:#080d1a;border:1px solid #465777;border-radius:12px;padding:16px}
h3{margin:0 0 4px;font-size:18px}
.status{font-size:12px;color:#90a3c1;margin-bottom:10px}.status b{color:#4ade80}.status.off b{color:#ff5a6e}
.preview{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;background:#111b2d;border:1px solid #3d506f;border-radius:10px;padding:10px;margin-bottom:6px;font-family:Impact,"Arial Narrow",sans-serif}
.preview .b{color:#6bdcff}.preview .r{color:#ff7c8b}.preview strong{display:block;font-size:34px;line-height:1}.preview small{font-family:Arial,sans-serif;color:#b8c9e5;font-size:11px}
.preview .t{font-size:26px}
label{display:block;margin:10px 0 3px;color:#b8c9e5}
input{width:100%;padding:8px;background:#111b2d;border:1px solid #3d506f;color:#fff;border-radius:6px;font-size:14px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
button{border:1px solid #456083;background:#172641;color:#fff;padding:9px;border-radius:6px;cursor:pointer;font-size:14px}
button:hover{filter:brightness(1.3)}button:active{transform:scale(.98)}
.bluebtn{background:#075fe4}.redbtn{background:#b40c28}.wide{grid-column:1/-1}
.hint{font-size:11px;color:#90a3c1;margin-top:12px}
code{background:#111b2d;padding:1px 4px;border-radius:4px}
</style>
</head>
<body>
<main class="controls">
  <h3>⚙ Controle do placar</h3>
  <div class="status off" id="status">Servidor: <b>conectando…</b></div>

  <div class="preview">
    <div class="b"><strong id="pBlue">0</strong><small>votos <span id="pBlueVote">0</span></small></div>
    <div class="t" id="pTimer">--:--</div>
    <div class="r"><strong id="pRed">0</strong><small>votos <span id="pRedVote">0</span></small></div>
  </div>

  <label for="blueInput">Nome do time azul</label><input id="blueInput" maxlength="40">
  <label for="redInput">Nome do time vermelho</label><input id="redInput" maxlength="40">

  <div class="btns">
    <button class="bluebtn" data-act="score" data-team="blue" data-n="1">Azul +1</button>
    <button class="redbtn" data-act="score" data-team="red" data-n="1">Vermelho +1</button>
    <button data-act="score" data-team="blue" data-n="5">Azul +5</button>
    <button data-act="score" data-team="red" data-n="5">Vermelho +5</button>
    <button data-act="score" data-team="blue" data-n="-1">Azul −1</button>
    <button data-act="score" data-team="red" data-n="-1">Vermelho −1</button>
  </div>

  <label for="minutes">Tempo da partida (minutos)</label><input id="minutes" type="number" min="1" max="99" value="5">
  <div class="btns">
    <button data-act="start">▶ Iniciar</button>
    <button data-act="pause">Ⅱ Pausar</button>
    <button id="resetTimer">↺ Reiniciar tempo</button>
    <button data-act="resetScores">Zerar pontos</button>
  </div>

  <label>Votos</label>
  <div class="btns">
    <button class="bluebtn" data-act="vote" data-team="blue">Voto azul +1</button>
    <button class="redbtn" data-act="vote" data-team="red">Voto vermelho +1</button>
    <button data-act="resetVotes" class="wide">Zerar votos</button>
    <button data-act="resetAll" class="wide">Restaurar exemplo</button>
  </div>

  <div class="hint">
    Atalhos: <code>1</code> azul +1 · <code>2</code> vermelho +1 · <code>5</code> voto azul · <code>6</code> voto vermelho · <code>espaço</code> iniciar/pausar.<br><br>
    Integrações externas (TikFinity, Streamer.bot, etc.) podem chamar URLs como
    <code>/api/vote?team=blue</code> ou <code>/api/score?team=red&amp;n=5</code>.
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
let current=null;

async function send(action){
  try{
    await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(action)});
  }catch(e){console.error(e)}
}

document.querySelectorAll('[data-act]').forEach(btn=>btn.addEventListener('click',()=>{
  const a={type:btn.dataset.act};
  if(btn.dataset.team)a.team=btn.dataset.team;
  if(btn.dataset.n)a.n=Number(btn.dataset.n);
  if(a.type==='resetAll'&&!confirm('Restaurar todos os valores de exemplo?'))return;
  send(a);
}));
$('resetTimer').addEventListener('click',()=>send({type:'resetTimer',minutes:Number($('minutes').value)||5}));

let nameTimers={};
['blue','red'].forEach(team=>{
  $(team+'Input').addEventListener('input',e=>{
    clearTimeout(nameTimers[team]);
    nameTimers[team]=setTimeout(()=>send({type:'name',team,value:e.target.value}),200);
  });
});

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='1')send({type:'score',team:'blue',n:1});
  if(e.key==='2')send({type:'score',team:'red',n:1});
  if(e.key==='5')send({type:'vote',team:'blue'});
  if(e.key==='6')send({type:'vote',team:'red'});
  if(e.key===' '){e.preventDefault();send({type:current&&current.running?'pause':'start'})}
});

function render(s){
  current=s;
  $('pBlue').textContent=s.scores.blue;$('pRed').textContent=s.scores.red;
  $('pBlueVote').textContent=s.votes.blue;$('pRedVote').textContent=s.votes.red;
  $('pTimer').textContent=String(Math.floor(s.seconds/60)).padStart(2,'0')+':'+String(s.seconds%60).padStart(2,'0');
  // Não sobrescreve o campo enquanto o usuário digita nele.
  if(document.activeElement!==$('blueInput'))$('blueInput').value=s.names.blue;
  if(document.activeElement!==$('redInput'))$('redInput').value=s.names.red;
  if(document.activeElement!==$('minutes'))$('minutes').value=s.minutes;
}

const es=new EventSource('/events');
es.addEventListener('state',e=>render(JSON.parse(e.data)));
es.onopen=()=>{$('status').className='status';$('status').innerHTML='Servidor: <b>conectado</b>'};
es.onerror=()=>{$('status').className='status off';$('status').innerHTML='Servidor: <b>desconectado — tentando reconectar…</b>'};
</script>
</body>
</html>
